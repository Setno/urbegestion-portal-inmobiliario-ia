# CI de metodo-apps ajustado al stack (Node + Vite). Corre en GitHub Actions, no despliega nada.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'chore/**']

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura mínima
        run: npm run test:coverage

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Build del sitio
        run: npm run build:sitio

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error
