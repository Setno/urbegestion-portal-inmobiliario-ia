# CI de metodo-apps ajustado al stack (Node + Vite). Corre en GitHub Actions, no despliega nada.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'chore/**']

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error
